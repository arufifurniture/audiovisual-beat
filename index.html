          window.addEventListener('message', function(event) {
            try {
              if (!event.data) return;
              var isMatch = false;
              var id = 0;
              if (typeof event.data === 'string') {
                if (event.data.indexOf('call method') !== -1 || event.data.indexOf('chrome:') !== -1) {
